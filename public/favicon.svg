<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="redlabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="#090A0F" stroke="#E11D48" stroke-width="2.5" />
  
  <!-- Subtle inner gradient glow -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#12141D" />

  <!-- Flask outline & liquid -->
  <path d="M26 12 H38 V22 L49 46 C50.5 49 48.5 53 45 53 H19 C15.5 53 13.5 49 15 46 L26 22 Z" 
        fill="none" 
        stroke="url(#redlabGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />
  
  <!-- Liquid fill inside flask -->
  <path d="M19 46 L23 37 Q32 39 41 37 L45 46 C46 48 44.5 50 42 50 H22 C19.5 50 18 48 19 46 Z" 
        fill="url(#redlabGrad)" 
        opacity="0.85" />
        
  <!-- Glowing bubbles inside flask -->
  <circle cx="28" cy="44" r="2.5" fill="#FFFFFF" opacity="0.9" filter="url(#glow)" />
  <circle cx="36" cy="42" r="1.8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="31" cy="35" r="1.5" fill="#FFFFFF" opacity="0.7" />

  <!-- Top Flask Lip -->
  <line x1="24" y1="12" x2="40" y2="12" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" />
</svg>
